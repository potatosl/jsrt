<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="theme-color" content="#6654f1">
<script>
  // Choose the color scheme before first paint: a saved choice wins, then the
  // OS preference. The stock stylesheet is swapped by file name, matching the
  // assets/css/just-the-docs-jsrt-*.scss files.
  (function () {
    var key = 'jsrt-theme';
    var theme = null;
    try { theme = localStorage.getItem(key); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var root = document.documentElement;
    root.setAttribute('data-jsrt-theme', theme);
    var link = document.querySelector('link[rel="stylesheet"]');
    var base = link.getAttribute('href').replace(/just-the-docs-[^\/]*\.css$/, '');
    function apply(next) {
      link.setAttribute('href', base + 'just-the-docs-jsrt-' + next + '.css');
      root.setAttribute('data-jsrt-theme', next);
      root.style.backgroundColor = next === 'dark' ? '#1a1b1e' : '#ffffff';
    }
    apply(theme);
    document.addEventListener('DOMContentLoaded', function () {
      var header = document.getElementById('main-header');
      if (!header) { return; }
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'theme-toggle';
      button.setAttribute('aria-label', 'Toggle light and dark theme');
      button.innerHTML =
        '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>' +
        '<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      button.addEventListener('click', function () {
        theme = theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(key, theme); } catch (e) {}
        apply(theme);
      });
      header.appendChild(button);
    });
  })();
</script>
